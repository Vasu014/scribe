name: Scribe
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    ARCHS: [arm64]
    HARDENED_RUNTIME_ENABLE: YES
    SUPPORTS_MACCATALYST: NO
targets:
  Scribe:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: MeetingKitCore
        products:
          - CaptureKit
          - TranscribeKit
          - ScratchpadKit
          - FusionKit
          - SessionKit
          - Persistence
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Scribe
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSMicrophoneUsageDescription: "Scribe records your microphone during meetings you start, so it can transcribe what you say. Audio never leaves your Mac and is never saved to disk."
    entitlements:
      path: App/Scribe.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.app-sandbox: false
packages:
  MeetingKitCore:
    path: Packages/MeetingKitCore
schemes:
  Scribe:
    build:
      targets:
        Scribe: all
    run:
      config: Debug
