name: Scribe
options:
  bundleIdPrefix: io.github.vasu014
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    ARCHS: [arm64]
    # Set explicitly, NOT derived from bundleIdPrefix + target name: that
    # would yield `io.github.vasu014.Scribe` (capital S from the target).
    # This string is the app's identity to macOS — TCC grants, the Keychain
    # service, the defaults domain and Sparkle update matching all key off
    # it, so it must not drift (SPEC §6).
    PRODUCT_BUNDLE_IDENTIFIER: io.github.vasu014.scribe
    # SPEC §6: hardened runtime (Developer ID notarization requires it).
    ENABLE_HARDENED_RUNTIME: YES
    SUPPORTS_MACCATALYST: NO
    # Sparkle (SPEC §6; T9): Info.plist substitutes these via
    # $(SUFEED_URL)/$(SUPUBLIC_ED_KEY). Placeholders here for dev builds;
    # scripts/release.sh overrides SUFEED_URL from SCRIBE_FEED_URL (and
    # SUPUBLIC_ED_KEY from SCRIBE_PUBLIC_ED_KEY at signing week — see
    # App/dsa_pub.pem + scripts/README.md).
    SUFEED_URL: "https://example.com/scribe/appcast.xml"
    SUPUBLIC_ED_KEY: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Scribe:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: MeetingKitCore
        products:
          - CaptureKit
          - TranscribeKit
          - ScratchpadKit
          - FusionKit
          - SessionKit
          - Persistence
      # Sparkle 2, APP TARGET ONLY (SPEC §6; T9) — never a MeetingKitCore dep.
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Scribe
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSMicrophoneUsageDescription: "Scribe records your microphone during meetings you start, so it can transcribe what you say. Audio never leaves your Mac and is never saved to disk."
        # Sparkle (SPEC §6; T9) — substituted at build time; see settings.base
        # above and scripts/release.sh.
        SUFeedURL: "$(SUFEED_URL)"
        SUPublicEDKey: "$(SUPUBLIC_ED_KEY)"
        SUEnableInstallerLauncherService: true
    entitlements:
      path: App/Scribe.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.app-sandbox: false
  ScribeAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ScribeAppTests
      - App
    dependencies:
      - package: MeetingKitCore
        products:
          - CaptureKit
          - TranscribeKit
          - ScratchpadKit
          - FusionKit
          - SessionKit
          - Persistence
      - package: Sparkle
packages:
  MeetingKitCore:
    path: Packages/MeetingKitCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
schemes:
  Scribe:
    build:
      targets:
        Scribe: all
        ScribeAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ScribeAppTests]
